# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# The generic SLSA generator must be pinned to the full tag v2.1.0.
# slsa-verifier identifies the trusted builder by that tag, not by a commit SHA.

name: SLSA generic generator

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux
          - os: windows-latest
            id: windows
          - os: macos-latest
            id: macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action revision
        with:
          components: rustfmt, clippy

      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev zip

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run tests without the desktop feature
        run: cargo test --locked --no-default-features --all-targets

      - name: Build the release executable
        run: cargo build --release --locked

      - name: Package and hash the release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/MyDigitalBuddy
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp target/release/mydigitalbuddy.exe dist/MyDigitalBuddy/MyDigitalBuddy.exe
          else
            cp target/release/mydigitalbuddy dist/MyDigitalBuddy/MyDigitalBuddy
          fi
          cp README.md LICENSE NOTICE PRIVACIDADE.md dist/MyDigitalBuddy/
          cp -R pets docs dist/MyDigitalBuddy/
          archive="MyDigitalBuddy-${RUNNER_OS}-${RUNNER_ARCH}.zip"
          if command -v zip >/dev/null 2>&1; then
            (cd dist && zip -r "../${archive}" MyDigitalBuddy)
          else
            tar -a -cf "${archive}" -C dist MyDigitalBuddy
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "${archive}" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "${digest}" "${archive}" > "subject-${{ matrix.id }}.txt"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyDigitalBuddy-${{ matrix.id }}-${{ runner.arch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the provenance subject
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subject-${{ matrix.id }}
          path: subject-${{ matrix.id }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish the package to the tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Pacotes de desktop. A proveniência SLSA3 é anexada ao fim deste workflow."
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.package.outputs.archive }}" --clobber

  subjects:
    name: Collect release digests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download subject files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: subject-*
          merge-multiple: true

      - name: Encode the subjects
        id: hash
        run: |
          set -euo pipefail
          sort subject-*.txt > subjects.txt
          echo "hashes=$(base64 -w0 subjects.txt)" >> "${GITHUB_OUTPUT}"

  provenance:
    name: Generate SLSA3 provenance
    needs: subjects
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.subjects.outputs.hashes }}
      provenance-name: MyDigitalBuddy.intoto.jsonl
      upload-assets: ${{ github.ref_type == 'tag' }}
      upload-tag-name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

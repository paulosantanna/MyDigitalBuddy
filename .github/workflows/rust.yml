# separate terms of service, privacy policy, and support
# documentation.

name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action revision
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run tests without the desktop feature
        run: cargo test --locked --no-default-features --all-targets

  security:
    name: CVE and supply-chain versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - name: Install Linux graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify MSRV and locked manifest
        run: cargo check --locked --all-targets --all-features

      - name: Require current stable Rust (language security fixes)
        run: |
          rustup update stable --no-self-update
          rustc --version
          if rustup check 2>&1 | grep -q 'Update available'; then
            echo "Stable Rust is not current after rustup update stable."
            exit 1
          fi

      - name: Scan locked crates with Google OSV (CVE database)
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            scan source
            -L Cargo.lock
            --format vertical
            --verbosity error

      - name: RustSec advisory audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject stale Cargo.lock resolution
        run: |
          dry=$(cargo update --dry-run --locked 2>&1)
          echo "$dry"
          if echo "$dry" | grep -qE '^[[:space:]]*Updating[[:space:]]'; then
            echo "Cargo.lock is behind Cargo.toml; run cargo update --locked locally and commit."
            exit 1
          fi

name: Rust validation and desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action revision
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --no-default-features --all-targets
      - name: Build desktop executable
        if: github.event_name != 'pull_request'
        run: cargo build --release --locked
      - name: Package executable and license
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist/MyDigitalBuddy
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp target/release/mydigitalbuddy.exe dist/MyDigitalBuddy/MyDigitalBuddy.exe
          else
            cp target/release/mydigitalbuddy dist/MyDigitalBuddy/MyDigitalBuddy
          fi
          cp README.md LICENSE NOTICE PRIVACIDADE.md dist/MyDigitalBuddy/
          cp -R pets docs dist/MyDigitalBuddy/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: MyDigitalBuddy-${{ runner.os }}-${{ runner.arch }}
          path: dist/MyDigitalBuddy
          retention-days: 14

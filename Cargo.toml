[package]
name = "mydigitalbuddy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local desktop companion with a spiking neural network, written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/paulosantanna/MyDigitalBuddy"
default-run = "mydigitalbuddy"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
